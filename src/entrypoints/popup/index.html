<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Testing Tools</title>
    <meta name="manifest.type" content="browser_action" />
    <script>
      (function () {
        try {
          var raw = localStorage.getItem('snapshot/app/themeMode');
          var mode = raw ? JSON.parse(raw) : 'system';
          if (mode !== 'light' && mode !== 'dark' && mode !== 'system') mode = 'system';
          var isDark =
            mode === 'dark' ||
            (mode === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (isDark) document.documentElement.classList.add('dark');

          var routeRaw = localStorage.getItem('snapshot/app/popupRoute');
          var route = routeRaw ? JSON.parse(routeRaw) : 'timestamp';
          var heightMap = {
            timestamp: 480,
            storageCleaner: 500,
            qrCode: 520,
            textStatistics: 520,
            jwt: 560,
            jsonTools: 600,
            base64Converter: 560,
            rightClickRestorer: 420,
            testDataGenerator: 600,
          };
          var targetHeight = heightMap[route] || 600;
          document.documentElement.style.height = targetHeight + 'px';
          document.body.style.height = targetHeight + 'px';
        } catch (_error) {}
      })();
    </script>
    <style>
      /* Force initial popup size before React hydration */
      html, body {
        width: 450px;
        min-height: 400px;
        max-height: 600px;
        margin: 0;
        padding: 0;
        overflow: hidden;
        background-color: hsl(var(--background));
      }
      /* Ensure full size for the root container */
      #root {
        width: 100%;
        height: auto;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./main.tsx"></script>
  </body>
</html>
