<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" fill="none">
  <!-- Master: open toolbox, lid lifted, round Q-cute line art -->
  <g id="icon-main" stroke-linecap="round" stroke-linejoin="round">
    <!-- Handle on the lid -->
    <path d="M50 34V20a6 6 0 0 1 6-6h16a6 6 0 0 1 6 6v14" stroke="#0d9488" stroke-width="7"/>
    <!-- Trapezoid lid (lifted) -->
    <path d="M30 34h68l12 22H18Z" stroke="#0f172a" stroke-width="6"/>
    <!-- Body -->
    <rect x="18" y="64" width="92" height="46" rx="16" stroke="#0f172a" stroke-width="6"/>
    <!-- Latch on the front -->
    <rect x="53" y="72" width="22" height="16" rx="5" fill="#0d9488" stroke="#0f172a" stroke-width="3.5"/>
    <path d="M59 80h10" stroke="#0f172a" stroke-width="2.8"/>
    <!-- One screw -->
    <circle cx="36" cy="92" r="5" fill="#0d9488"/>
    <path d="M36 89.4v5.2M33.4 92h5.2" stroke="#0f172a" stroke-width="1.8"/>
  </g>
  <!-- 16px simplified: thick strokes, box + handle + latch -->
  <g id="icon-16" display="none" stroke-linecap="round" stroke-linejoin="round">
    <rect x="40" y="14" width="48" height="22" rx="10" fill="#0d9488"/>
    <rect x="16" y="36" width="96" height="76" rx="18" stroke="#0f172a" stroke-width="12"/>
    <rect x="48" y="64" width="32" height="18" rx="6" fill="#0d9488"/>
  </g>
</svg>
